name: Doc Pipeline — Coordinator

on:
  workflow_dispatch:
    inputs:
      module_name:
        description: "Module name (default: EcommerceApp)"
        required: false
        default: "EcommerceApp"
      start_phase:
        description: "Phase to start from (1=planning, 2=discovery, 3=business, 4=technical, 5=coordination, 6=verification)"
        required: false
        default: "1"

permissions:
  actions: write
  contents: read

jobs:
  kick-start:
    name: Kick-start Documentation Pipeline
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      REF: ${{ github.ref_name }}

    steps:
      - name: Dispatch starting phase
        run: |
          case "${{ inputs.start_phase }}" in
            1) WORKFLOW="doc-phase-1-planning.lock.yml" ;;
            2) WORKFLOW="doc-phase-2-discovery.lock.yml" ;;
            3) WORKFLOW="doc-phase-3-business.lock.yml" ;;
            4) WORKFLOW="doc-phase-4-technical.lock.yml" ;;
            5) WORKFLOW="doc-phase-5-coordination.lock.yml" ;;
            6) WORKFLOW="doc-phase-6-verification.lock.yml" ;;
            *) echo "Invalid start_phase: ${{ inputs.start_phase }}"; exit 1 ;;
          esac
          echo "▶ Dispatching phase ${{ inputs.start_phase }} — $WORKFLOW"
          gh workflow run "$WORKFLOW" \
            --repo "$REPO" \
            --ref "$REF" \
            --field module_name="${{ inputs.module_name }}"
          echo "✅ Phase ${{ inputs.start_phase }} dispatched — agents will chain automatically through all remaining phases"
